<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YesBook</title>

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* BODY */
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #141e30, #243b55);
            font-family: 'Segoe UI', sans-serif;
            color: white;
            text-align: center;
            padding: 50px 20px;
        }

        /* HEADINGS */
        h1 {
            color: #ff4d6d;
            font-size: clamp(35px, 6vw, 60px);
            margin-bottom: 20px;
            text-shadow: 0 0 15px #ff4d6d;
        }

        h2 {
            color: #ff85a1;
            font-size: clamp(28px, 5vw, 45px);
            margin-bottom: 15px;
        }

        h3 {
            color: #ffd166;
            font-size: clamp(23px, 4vw, 35px);
            margin-bottom: 15px;
        }

        h4 {
            color: #80ed99;
            font-size: clamp(19px, 3vw, 28px);
            margin-bottom: 20px;
        }

        /* PRE */
        pre {
            background: #252540;
            color: #80edff;
            padding: 25px;
            border-radius: 15px;
            display: inline-block;
            text-align: left;
            max-width: 100%;
            overflow-x: auto;
            font-size: 16px;
            line-height: 1.8;
            border: 1px solid #555577;
            margin: 20px 0;
        }

        /* LINK */
        a {
            display: inline-block;
            color: white;
            background: #4267B2;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 30px;
            margin: 15px;
            transition: 0.3s;
        }

        a:hover {
            background: #1877f2;
            transform: scale(1.08);
        }

        /* BUTTON */
        button {
            background: linear-gradient(45deg, #6c63ff, #a855f7);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px #6c63ff80;
        }

        button:active {
            transform: scale(0.95);
        }

        /* TABLET RESPONSIVE */
        @media (max-width: 768px) {
            body {
                padding: 35px 15px;
            }

            pre {
                font-size: 14px;
                padding: 20px;
            }

            a, button {
                padding: 12px 22px;
                font-size: 14px;
            }
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 480px) {
            body {
                padding: 25px 12px;
            }

            h1 {
                margin-bottom: 15px;
            }

            h2, h3, h4 {
                margin-bottom: 10px;
            }

            pre {
                width: 100%;
                font-size: 12px;
                padding: 15px;
            }

            a, button {
                display: block;
                width: 100%;
                max-width: 300px;
                margin: 12px auto;
                font-size: 14px;
            }
        }

        /* SMALL MOBILE */
        @media (max-width: 320px) {
            body {
                padding: 15px 8px;
            }

            pre {
                font-size: 11px;
            }

            a, button {
                padding: 11px;
                font-size: 13px;
            }
        }

        /* REDUCED MOTION */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>

<body>

    <h1>Hello World</h1>
    <h2>Hello World</h2>
    <h3>Hello World</h3>
    <h4>Hello World</h4>

    <pre>
    hello world
    hello world
    hello world
    </pre>

    <br>

    <a href="https://www.facebook.com" target="_blank">
        Hello boys and girls
    </a>

    <button onclick="alert('Welcome to YesBook!')">
        This is my first button
    </button>

</body>
</html>
